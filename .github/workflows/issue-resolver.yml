name: T3Planet AI Bot

on:
  workflow_call:
    inputs:
      bot_ref:
        description: Git ref of vivek-nitsan/t3planet-ai-bot used to load scripts
        type: string
        required: false
        default: v1
      base_branch:
        description: Default branch of the calling repository
        type: string
        required: false
        default: main
    secrets:
      CURSOR_API_KEY:
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: t3planet-ai-bot-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Analyze and Resolve Issue
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: 1
      BOT_SCRIPTS: /tmp/t3planet-ai-bot/scripts/issue_triage

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout T3Planet AI Bot
        uses: actions/checkout@v4
        with:
          repository: vivek-nitsan/t3planet-ai-bot
          ref: ${{ inputs.bot_ref }}
          path: _t3planet_ai_bot

      - name: Prepare bot tools
        run: |
          mkdir -p /tmp/t3planet-ai-bot
          cp -a _t3planet_ai_bot/scripts /tmp/t3planet-ai-bot/scripts
          chmod +x /tmp/t3planet-ai-bot/scripts/issue_triage/*.sh

          mkdir -p .cursor
          if [ ! -f .cursor/cli.json ]; then
            cp _t3planet_ai_bot/.cursor/cli.json .cursor/cli.json
          fi

          # Keep bot checkout out of the caller workspace / commits
          rm -rf _t3planet_ai_bot

      - name: Guard Cursor API key
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "CURSOR_API_KEY secret is not set."
            printf '%s\n' "guard" > /tmp/cursor-stage.txt
            echo "CURSOR_STAGE=guard" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"
          cursor-agent --version

      - name: Collect Issue Context
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api \
            --paginate \
            "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
            > /tmp/issue-comments.json

      - name: Triage Issue
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_COMMENT: ${{ github.event.comment.body }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 "${BOT_SCRIPTS}/build_triage_prompt.py"

          bash "${BOT_SCRIPTS}/run_cursor.sh" \
            triage \
            /tmp/triage-prompt.txt \
            /tmp/triage-result.txt

          bash "${BOT_SCRIPTS}/detect_result.sh" /tmp/triage-result.txt

      - name: Comment Triage Result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 "${BOT_SCRIPTS}/format_triage_comment.py"

          gh issue comment "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/issue-comment.md

      - name: Add Needs Information Label
        if: env.RESULT == 'NEEDS_INFORMATION'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if ! gh label list \
            --repo "${{ github.repository }}" \
            --limit 100 \
            --json name \
            --jq '.[].name' | grep -Fxq "needs-information"; then
            gh label create "needs-information" \
              --repo "${{ github.repository }}" \
              --color "FBCA04" \
              --description "T3Planet AI Bot is waiting for more information"
          fi

          gh issue edit "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --add-label "needs-information"

      - name: Remove Needs Information Label
        if: |
          env.RESULT == 'VALID_ISSUE' ||
          env.RESULT == 'NOT_AN_ISSUE' ||
          env.RESULT == 'REVIEW_REQUIRED'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --remove-label "needs-information" || true

      - name: Reset Triage Changes
        if: env.RESULT == 'VALID_ISSUE'
        run: |
          git reset --hard HEAD
          git clean -fd

      - name: Check Existing Pull Request
        if: env.RESULT == 'VALID_ISSUE'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH_NAME="ai/fix-issue-${ISSUE_NUMBER}"
          echo "BRANCH_NAME=${BRANCH_NAME}" >> "$GITHUB_ENV"

          EXISTING_PR=$(
            gh pr list \
              --repo "${{ github.repository }}" \
              --head "${BRANCH_NAME}" \
              --state open \
              --json url \
              --jq '.[0].url // empty'
          )

          if [ -n "$EXISTING_PR" ]; then
            echo "PR_ALREADY_EXISTS=true" >> "$GITHUB_ENV"
            echo "PR_URL=${EXISTING_PR}" >> "$GITHUB_ENV"
          else
            echo "PR_ALREADY_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Comment Existing Pull Request
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat > /tmp/existing-pr-comment.md <<EOF
          <img src="https://raw.githubusercontent.com/vivek-nitsan/t3planet-ai-bot/v1/assets/bot-icon.png" width="28" height="28" alt="T3Planet AI Bot" /> **T3Planet AI Bot**

          ### 🔍 Issue Analysis

          **Classification:** ✅ \`VALID_ISSUE\`

          ### 🚀 Draft Pull Request

          A draft Pull Request already exists for this issue:

          ${PR_URL}

          No new branch or Pull Request was created.
          EOF

          gh issue comment "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/existing-pr-comment.md

      - name: Create Issue Branch
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS != 'true'
        env:
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          git config user.name "T3Planet AI Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin "${BASE_BRANCH}"
          git fetch origin "${BRANCH_NAME}" || true

          if git show-ref --verify --quiet "refs/remotes/origin/${BRANCH_NAME}"; then
            git checkout -B "${BRANCH_NAME}" "origin/${BASE_BRANCH}"
          else
            git checkout -b "${BRANCH_NAME}"
          fi

      - name: Resolve Issue with Cursor
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS != 'true'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 "${BOT_SCRIPTS}/build_resolve_prompt.py"

          bash "${BOT_SCRIPTS}/run_cursor.sh" \
            resolve \
            /tmp/resolve-prompt.txt \
            /tmp/resolve-result.txt

      - name: Verify Test Report
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS != 'true'
        run: |
          bash "${BOT_SCRIPTS}/verify_test_report.sh" /tmp/resolve-result.txt

      - name: Check Changes
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS != 'true'
        id: changes
        run: |
          find . -name .DS_Store -type f -delete 2>/dev/null || true
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -type f -delete 2>/dev/null || true

          git status --short

          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          git diff --stat

      - name: Comment - No Code Change Required
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS != 'true' &&
          steps.changes.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat > /tmp/no-change-comment.md <<EOF
          <img src="https://raw.githubusercontent.com/vivek-nitsan/t3planet-ai-bot/v1/assets/bot-icon.png" width="28" height="28" alt="T3Planet AI Bot" /> **T3Planet AI Bot**

          ### 🔍 Issue Analysis

          **Classification:** ✅ \`VALID_ISSUE\`

          ### ⚠️ No Code Change

          The issue was classified as valid, but Cursor did not make
          any repository changes.

          ### 📋 Analysis

          $(cat /tmp/resolve-result.txt)

          No Pull Request was created.
          EOF

          gh issue comment "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/no-change-comment.md

      - name: Commit Changes
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS != 'true' &&
          steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          find . -name .DS_Store -type f -delete 2>/dev/null || true
          find . -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          find . -name '*.pyc' -type f -delete 2>/dev/null || true

          unexpected=""

          while IFS= read -r line; do
            [ -z "$line" ] && continue

            status="${line:0:2}"
            path="${line:3}"
            path="${path#\"}"
            path="${path%\"}"

            [ "$status" != "??" ] && continue

            case "$path" in
              .DS_Store|*/.DS_Store|__pycache__|__pycache__/*|*/__pycache__/*|*.pyc|*.log|tmp|tmp/*|temp|temp/*|_t3planet_ai_bot|_t3planet_ai_bot/*)
                rm -rf -- "$path" 2>/dev/null || true
                ;;
              .env|.env.*|*.key|*.pem|*credential*|node_modules|node_modules/*)
                unexpected="${unexpected}${path}"$'\n'
                ;;
            esac
          done < <(git status --porcelain)

          if [ -n "$unexpected" ]; then
            cat > /tmp/unexpected-files-comment.md <<EOF
          <img src="https://raw.githubusercontent.com/vivek-nitsan/t3planet-ai-bot/v1/assets/bot-icon.png" width="28" height="28" alt="T3Planet AI Bot" /> **T3Planet AI Bot**

          ### ⚠️ Unexpected Files

          The automated fix produced files that must not be committed:

          \`\`\`
          ${unexpected}
          \`\`\`

          No Pull Request was created.
          EOF

            gh issue comment "$ISSUE_NUMBER" \
              --repo "${{ github.repository }}" \
              --body-file /tmp/unexpected-files-comment.md

            echo "FAILURE_ALREADY_COMMENTED=true" >> "$GITHUB_ENV"
            exit 1
          fi

          git add -u

          while IFS= read -r line; do
            [ -z "$line" ] && continue

            status="${line:0:2}"
            path="${line:3}"
            path="${path#\"}"
            path="${path%\"}"

            [ "$status" != "??" ] && continue

            case "$path" in
              .DS_Store|*/.DS_Store|__pycache__|__pycache__/*|*/__pycache__/*|*.pyc|*.log|tmp|tmp/*|.env|.env.*|*.key|*.pem|node_modules|node_modules/*|_t3planet_ai_bot|_t3planet_ai_bot/*)
                continue
                ;;
            esac

            git add -- "$path"
          done < <(git status --porcelain)

          git diff --cached --name-only
          git commit -m "Fix issue #${{ github.event.issue.number }}"

      - name: Push Issue Branch
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS != 'true' &&
          steps.changes.outputs.has_changes == 'true'
        run: |
          git push --force-with-lease --set-upstream origin "${BRANCH_NAME}"

      - name: Create Draft Pull Request
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS != 'true' &&
          steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          BASE_BRANCH: ${{ inputs.base_branch }}
        run: |
          python3 "${BOT_SCRIPTS}/format_pr_body.py"

          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --base "${BASE_BRANCH}" \
            --head "${BRANCH_NAME}" \
            --title "Fix #${ISSUE_NUMBER}: ${ISSUE_TITLE}" \
            --body-file /tmp/pr-body.md \
            --draft)

          echo "PR_URL=${PR_URL}" >> "$GITHUB_ENV"

      - name: Comment Pull Request on Issue
        if: |
          env.RESULT == 'VALID_ISSUE' &&
          env.PR_ALREADY_EXISTS != 'true' &&
          steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 "${BOT_SCRIPTS}/format_pr_issue_comment.py"

          gh issue comment "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/pr-comment.md

      - name: Comment Failure
        if: |
          failure() &&
          env.FAILURE_ALREADY_COMMENTED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          python3 "${BOT_SCRIPTS}/format_failure_comment.py"

          gh issue comment "$ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/failure-comment.md
